name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_emulator:
        description: "Jalankan pengujian emulator (profil kerja)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit test, lint, APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Paket default "tools" sudah tidak ada di SDK manager terbaru.
          packages: platform-tools

      # setup-gradle memvalidasi checksum gradle-wrapper.jar terhadap rilis resmi Gradle.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test (:core JVM + :app JVM)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build APK debug (ClonApps + fixture)
        run: ./gradlew --stacktrace :app:assembleDebug :fixture:assembleDebug :fixture:bundleDebug

      - name: Fixture sebagai split APK (bundletool)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Rilis terbaru bundletool dari repo resmi google/bundletool.
          gh release download --repo google/bundletool --pattern 'bundletool-all-*.jar' --output bundletool.jar --clobber
          # Keystore uji sekali pakai, hanya untuk fixture; tidak disimpan di repository.
          keytool -genkeypair -keystore fixture-test.jks -storepass android -keypass android -alias fixture \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=ClonApps Fixture Test" -noprompt
          java -jar bundletool.jar build-apks --overwrite \
            --bundle=fixture/build/outputs/bundle/debug/fixture-debug.aab \
            --output=fixture-split.apks \
            --ks=fixture-test.jks --ks-pass=pass:android --ks-key-alias=fixture --key-pass=pass:android
          mkdir -p fixture-split && unzip -o -q fixture-split.apks -d fixture-split
          ls -R fixture-split | head -50

      - name: Kemas APK, SHA-256, dan commit asal
        id: pkg
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName = "' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          SHORT=${GITHUB_SHA::7}
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ClonApps-v${VERSION}-debug-${SHORT}.apk"
          cp fixture/build/outputs/apk/debug/fixture-debug.apk "dist/ClonAppsFixture-debug-${SHORT}.apk"
          cp fixture-split.apks "dist/ClonAppsFixture-split-debug-${SHORT}.apks"
          (cd dist && sha256sum *.apk *.apks > SHA256SUMS.txt)
          cat > dist/BUILD-INFO.txt <<INFO
          ClonApps build debug — BUKAN rilis produksi (ditandatangani kunci debug Android Gradle Plugin).
          Versi        : ${VERSION}
          Commit       : ${GITHUB_SHA}
          Branch/ref   : ${GITHUB_REF}
          Workflow run : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Dibangun     : $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Build APK yang berhasil tidak membuktikan kompatibilitas aplikasi target. Lihat docs/TESTING.md.
          INFO
          cat dist/SHA256SUMS.txt
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ClonApps-debug-${{ steps.pkg.outputs.short }}
          path: dist/
          if-no-files-found: error

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Unggah laporan uji & lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Unggah bahan uji emulator
        uses: actions/upload-artifact@v4
        with:
          name: emulator-inputs
          path: |
            dist/ClonApps-*.apk
            fixture-split/splits/
          retention-days: 3

  emulator:
    name: Emulator (instrumentasi + isolasi profil kerja)
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Paket default "tools" sudah tidak ada di SDK manager terbaru.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-inputs
          path: inputs
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Jalankan emulator API 34 dan pengujian
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --stacktrace :app:connectedDebugAndroidTest
            bash scripts/emulator-profile-test.sh emulator-report.txt "inputs/fixture-split/splits" "$(ls inputs/dist/ClonApps-*.apk | head -1)"
      - name: Unggah hasil emulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results-${{ github.run_number }}
          path: |
            emulator-report.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
